<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Vitesse — Jeux</title>
<meta name="theme-color" content="#4f6df5" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../favicon.ico" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../shared/style.css" />
<link rel="stylesheet" href="../shared/auth-widget.css" />
<link rel="stylesheet" href="style.css" />
<script src="../shared/theme.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../shared/supabase-config.js" defer></script>
<script src="../shared/supabase-client.js" defer></script>
<script src="../shared/auth-widget.js" defer></script>
<script src="../shared/pwa.js" defer></script>
<script src="../shared/version-badge.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html">← Jeux</a>
    <div class="brand"><span class="logo">⚡</span> Vitesse</div>
    <div class="header-actions">
      <div id="auth-widget"></div>
      <button id="theme-toggle" class="icon-btn" aria-label="Changer de thème">🌙</button>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h1>Vitesse</h1>
      <p>Teste ta rapidité : à l'écrit ou au clic.</p>
    </div>

    <div class="btn-row" style="margin-bottom: 20px;">
      <button class="btn-secondary btn mode-btn active" data-mode="frappe">⌨️ Frappe</button>
      <button class="btn-secondary btn mode-btn" data-mode="reaction">⚡ Réactivité</button>
    </div>

    <!-- Mode Frappe -->
    <section id="mode-frappe">
      <div class="stats-row">
        <div class="stat"><div class="value" id="frappe-wpm">0</div><div class="label">Mots / min</div></div>
        <div class="stat"><div class="value" id="frappe-accuracy">100%</div><div class="label">Précision</div></div>
        <div class="stat"><div class="value" id="frappe-progress">0/8</div><div class="label">Mots</div></div>
      </div>

      <div class="panel frappe-panel">
        <div id="frappe-words" class="frappe-words"></div>
        <input type="text" id="frappe-input" class="frappe-input" placeholder="Tape le mot en surbrillance puis espace…" autocomplete="off" autocapitalize="off" spellcheck="false" disabled />
      </div>

      <p id="frappe-message" class="message"></p>

      <div class="btn-row" style="margin-top: 18px;">
        <button class="btn" id="frappe-start">Démarrer</button>
      </div>
    </section>

    <!-- Mode Réactivité -->
    <section id="mode-reaction" style="display:none;">
      <div class="stats-row">
        <div class="stat"><div class="value" id="reaction-round">0/5</div><div class="label">Manche</div></div>
        <div class="stat"><div class="value" id="reaction-avg">–</div><div class="label">Moyenne (ms)</div></div>
      </div>

      <div id="reaction-zone" class="reaction-zone idle">
        <span id="reaction-zone-text">Clique sur « Démarrer »</span>
      </div>

      <div class="btn-row" style="margin-top: 18px;">
        <button class="btn" id="reaction-start">Démarrer</button>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="end-modal">
    <div class="modal">
      <h2 id="end-title">⚡ Résultat</h2>
      <p id="end-text"></p>
      <p id="end-save-status" class="auth-hint"></p>
      <div class="btn-row">
        <button class="btn" id="end-replay">Rejouer</button>
        <a class="btn-secondary btn" href="../index.html">🏠 Menu</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
