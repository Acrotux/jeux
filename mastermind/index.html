<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Mastermind — Jeux</title>
<meta name="theme-color" content="#4f6df5" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../favicon.ico" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../shared/style.css" />
<link rel="stylesheet" href="../shared/auth-widget.css" />
<link rel="stylesheet" href="style.css" />
<script src="../shared/theme.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../shared/supabase-config.js" defer></script>
<script src="../shared/supabase-client.js" defer></script>
<script src="../shared/auth-widget.js" defer></script>
<script src="../shared/pwa.js" defer></script>
<script src="../shared/version-badge.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html">← Jeux</a>
    <div class="brand"><span class="logo">🎯</span> Mastermind</div>
    <div class="header-actions">
      <div id="auth-widget"></div>
      <button id="theme-toggle" class="icon-btn" aria-label="Changer de thème">🌙</button>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h1>Mastermind</h1>
      <p>Devine la combinaison secrète. ⚫ = bonne couleur, bonne place. ⚪ = bonne couleur, mauvaise place.</p>
    </div>

    <div class="btn-row" style="margin-bottom: 16px;">
      <button class="btn-secondary btn diff-btn" data-diff="facile">Facile</button>
      <button class="btn-secondary btn diff-btn" data-diff="moyen">Moyen</button>
      <button class="btn-secondary btn diff-btn" data-diff="difficile">Difficile</button>
    </div>

    <div class="stats-row">
      <div class="stat"><div class="value" id="attempts-left">10</div><div class="label">Essais restants</div></div>
    </div>

    <div id="mm-current" class="mm-current panel"></div>

    <div class="mm-palette" id="mm-palette"></div>

    <div class="btn-row" style="margin: 14px 0 24px;">
      <button class="btn-secondary btn" id="mm-clear">Effacer</button>
      <button class="btn" id="mm-submit">Valider</button>
    </div>

    <div id="mm-history" class="mm-history"></div>

    <div class="btn-row" style="margin-top: 20px;">
      <button class="btn" id="new-game">Nouvelle partie</button>
    </div>
  </main>

  <div class="modal-overlay" id="end-modal">
    <div class="modal">
      <h2 id="end-title">🎉 Gagné !</h2>
      <p id="end-text"></p>
      <p id="end-save-status" class="auth-hint"></p>
      <div class="btn-row">
        <button class="btn" id="end-replay">Rejouer</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
