<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Memory — Jeux</title>
<meta name="theme-color" content="#4f6df5" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../favicon.ico" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../shared/style.css" />
<link rel="stylesheet" href="../shared/auth-widget.css" />
<link rel="stylesheet" href="style.css" />
<script src="../shared/theme.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0" defer></script>
<script src="../shared/supabase-config.js" defer></script>
<script src="../shared/supabase-client.js" defer></script>
<script src="../shared/auth-widget.js" defer></script>
<script src="../shared/game-leaderboard.js" defer></script>
<script src="../shared/pwa.js" defer></script>
<script src="../shared/version-badge.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html">← Jeux</a>
    <div class="brand"><span class="logo">🧠</span> Memory</div>
    <div class="header-actions">
      <div id="auth-widget"></div>
      <button id="theme-toggle" class="icon-btn" aria-label="Changer de thème">🌙</button>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h1>Memory</h1>
      <p>Retrouve toutes les paires de cartes identiques.</p>
    </div>

    <div id="mini-leaderboard" class="mini-leaderboard" data-game="memory"></div>

    <div id="setup-screen" class="panel setup-screen">
      <h2>Choisis la taille de la grille</h2>
      <div class="btn-row">
        <button class="btn size-btn" data-size="4">4×4</button>
        <button class="btn size-btn" data-size="5">5×4</button>
        <button class="btn size-btn" data-size="6">6×5</button>
      </div>
    </div>

    <div id="game-content" style="display:none;">
      <p><a href="#" id="change-setup">← Changer de taille</a></p>

      <div class="stats-row">
        <div class="stat"><div class="value" id="timer">00:00</div><div class="label">Temps</div></div>
        <div class="stat"><div class="value" id="moves">0</div><div class="label">Coups</div></div>
        <div class="stat"><div class="value" id="pairs">0/0</div><div class="label">Paires</div></div>
      </div>

      <div id="memory-grid" class="memory-grid"></div>

      <div class="btn-row" style="margin-top: 20px;">
        <button class="btn" id="new-game">Nouvelle partie</button>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="win-modal">
    <div class="modal">
      <h2>🎉 Bravo !</h2>
      <p id="win-text">Toutes les paires trouvées.</p>
      <p id="win-save-status" class="auth-hint"></p>
      <div class="btn-row">
        <button class="btn" id="win-replay">Rejouer</button>
        <a class="btn-secondary btn" href="../index.html">🏠 Menu</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <a href="../mentions-legales/index.html">Mentions l&eacute;gales</a> &middot; <a href="../confidentialite/index.html">Confidentialit&eacute;</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
