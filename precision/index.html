<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Précision — Jeux</title>
<meta name="theme-color" content="#4f6df5" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../favicon.ico" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../shared/style.css" />
<link rel="stylesheet" href="../shared/auth-widget.css" />
<link rel="stylesheet" href="style.css" />
<script src="../shared/theme.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../shared/supabase-config.js" defer></script>
<script src="../shared/supabase-client.js" defer></script>
<script src="../shared/auth-widget.js" defer></script>
<script src="../shared/pwa.js" defer></script>
<script src="../shared/version-badge.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html">← Jeux</a>
    <div class="brand"><span class="logo">🎯</span> Précision</div>
    <div class="header-actions">
      <div id="auth-widget"></div>
      <button id="theme-toggle" class="icon-btn" aria-label="Changer de thème">🌙</button>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h1>Précision</h1>
      <p>Vise juste, au clic comme au timing.</p>
    </div>

    <div class="btn-row" style="margin-bottom: 20px;">
      <button class="btn-secondary btn mode-btn active" data-mode="visee">🎯 Visée</button>
      <button class="btn-secondary btn mode-btn" data-mode="barre">📏 Barre précise</button>
    </div>

    <!-- Mode Visée -->
    <section id="mode-visee">
      <div class="stats-row">
        <div class="stat"><div class="value" id="visee-round">0/8</div><div class="label">Cible</div></div>
        <div class="stat"><div class="value" id="visee-avg">–</div><div class="label">Précision moy.</div></div>
      </div>

      <div id="visee-zone" class="visee-zone"></div>

      <div class="btn-row" style="margin-top: 18px;">
        <button class="btn" id="visee-start">Démarrer</button>
      </div>
    </section>

    <!-- Mode Barre précise -->
    <section id="mode-barre" style="display:none;">
      <div class="stats-row">
        <div class="stat"><div class="value" id="barre-round">0/5</div><div class="label">Manche</div></div>
        <div class="stat"><div class="value" id="barre-avg">–</div><div class="label">Précision moy.</div></div>
      </div>

      <div class="barre-wrap">
        <div id="barre-track" class="barre-track">
          <div id="barre-target" class="barre-target"></div>
          <div id="barre-indicator" class="barre-indicator"></div>
        </div>
        <button class="btn" id="barre-stop" disabled>Stop !</button>
      </div>
      <p id="barre-message" class="message"></p>

      <div class="btn-row" style="margin-top: 18px;">
        <button class="btn" id="barre-start">Démarrer</button>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="end-modal">
    <div class="modal">
      <h2 id="end-title">🎯 Résultat</h2>
      <p id="end-text"></p>
      <p id="end-save-status" class="auth-hint"></p>
      <div class="btn-row">
        <button class="btn" id="end-replay">Rejouer</button>
        <a class="btn-secondary btn" href="../index.html">🏠 Menu</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
