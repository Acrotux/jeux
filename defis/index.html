<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Défis — Jeux</title>
<meta name="theme-color" content="#4f6df5" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../favicon.ico" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../shared/style.css" />
<link rel="stylesheet" href="../shared/auth-widget.css" />
<link rel="stylesheet" href="../profil/style.css" />
<link rel="stylesheet" href="style.css" />
<script src="../shared/theme.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0" defer></script>
<script src="../shared/supabase-config.js" defer></script>
<script src="../shared/supabase-client.js" defer></script>
<script src="../shared/auth-widget.js" defer></script>
<script src="../shared/pwa.js" defer></script>
<script src="../shared/version-badge.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html">← Jeux</a>
    <div class="brand"><span class="logo">⚔️</span> Défis</div>
    <div class="header-actions">
      <div id="auth-widget"></div>
      <button id="theme-toggle" class="icon-btn" aria-label="Changer de thème">🌙</button>
    </div>
  </header>

  <main>
    <div id="defis-logged-out" class="panel profil-cta" style="display:none;">
      <div class="emoji">🔐</div>
      <h2>Connecte-toi pour lancer des défis</h2>
      <p>Un email suffit — pas de mot de passe à retenir.</p>
      <button class="btn" id="defis-login-btn">Se connecter</button>
    </div>

    <div id="defis-not-configured" class="panel profil-cta" style="display:none;">
      <div class="emoji">🚧</div>
      <h2>Défis bientôt disponibles</h2>
    </div>

    <div id="defis-content" style="display:none;">
      <section class="panel defis-new">
        <h2>Lancer un défi</h2>
        <div class="defis-form">
          <div class="defis-search">
            <input type="text" id="defis-search-input" placeholder="Pseudo de ton adversaire" autocomplete="off" />
            <div id="defis-search-results" class="defis-search-results"></div>
          </div>
          <select id="defis-game-select">
            <option value="sudoku">🔢 Sudoku</option>
            <option value="pendu">🪢 Pendu</option>
            <option value="memory">🧠 Memory</option>
            <option value="mastermind">🎯 Mastermind</option>
            <option value="musique">🎵 Musique</option>
            <option value="vitesse">⚡ Vitesse</option>
            <option value="precision">🎯 Précision</option>
          </select>
          <button class="btn" id="defis-send-btn" disabled>Envoyer le défi</button>
        </div>
        <p id="defis-form-message" class="auth-hint"></p>
      </section>

      <section>
        <h2 class="defis-section-title">📩 Défis reçus</h2>
        <div id="defis-received" class="defis-list"></div>
      </section>

      <section>
        <h2 class="defis-section-title">⚔️ Défis en cours</h2>
        <div id="defis-active" class="defis-list"></div>
      </section>

      <section>
        <h2 class="defis-section-title">📜 Historique</h2>
        <div id="defis-history" class="defis-list"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <a href="../mentions-legales/index.html">Mentions l&eacute;gales</a> &middot; <a href="../confidentialite/index.html">Confidentialit&eacute;</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
