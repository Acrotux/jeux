<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Musique — Jeux</title>
<meta name="theme-color" content="#7c5cff" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../favicon.ico" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../shared/style.css" />
<link rel="stylesheet" href="../shared/auth-widget.css" />
<link rel="stylesheet" href="style.css" />
<script src="../shared/theme.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0" defer></script>
<script src="../shared/supabase-config.js" defer></script>
<script src="../shared/supabase-client.js" defer></script>
<script src="../shared/auth-widget.js" defer></script>
<script src="../shared/game-leaderboard.js" defer></script>
<script src="../shared/pwa.js" defer></script>
<script src="../shared/version-badge.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html">← Jeux</a>
    <div class="brand"><span class="logo">🎵</span> Musique</div>
    <div class="header-actions">
      <div id="auth-widget"></div>
      <button id="theme-toggle" class="icon-btn" aria-label="Changer de thème">🌙</button>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h1>Musique <span id="mode-label"></span></h1>
      <p><a href="../jeux/index.html">← Autres tests</a></p>
    </div>

    <div id="mini-leaderboard" class="mini-leaderboard"></div>

    <div id="setup-screen" class="panel setup-screen">
      <h2>Choisis un test</h2>
      <div class="btn-row">
        <button class="btn mode-choice-btn" data-mode="simon">Suite de sons</button>
        <button class="btn mode-choice-btn" data-mode="notes">Reconnaissance de notes</button>
      </div>
    </div>

    <div id="game-content" style="display:none;">
      <p><a href="#" id="change-setup">← Changer de test</a></p>

      <!-- Mode Simon -->
      <section id="mode-simon">
        <div class="stats-row">
          <div class="stat"><div class="value" id="simon-level">0</div><div class="label">Niveau</div></div>
          <div class="stat"><div class="value" id="simon-best">0</div><div class="label">Meilleur (session)</div></div>
        </div>

        <div class="simon-pads" id="simon-pads">
          <button class="simon-pad" data-note="0" style="background:#e2513f;"></button>
          <button class="simon-pad" data-note="1" style="background:#7c5cff;"></button>
          <button class="simon-pad" data-note="2" style="background:#ffce45;"></button>
          <button class="simon-pad" data-note="3" style="background:#2fb380;"></button>
        </div>

        <p id="simon-message" class="message"></p>

        <div class="btn-row" style="margin-top: 18px;">
          <button class="btn" id="simon-start">Démarrer</button>
        </div>
      </section>

      <!-- Mode Reconnaissance de notes -->
      <section id="mode-notes" style="display:none;">
        <div class="stats-row">
          <div class="stat"><div class="value" id="notes-round">0/10</div><div class="label">Manche</div></div>
          <div class="stat"><div class="value" id="notes-score">0</div><div class="label">Bonnes réponses</div></div>
        </div>

        <div class="panel notes-panel">
          <button class="btn" id="notes-play">🔊 Jouer la note</button>
          <p id="notes-message" class="message"></p>
          <div class="notes-choices" id="notes-choices"></div>
        </div>

        <div class="btn-row" style="margin-top: 18px;">
          <button class="btn" id="notes-start">Démarrer</button>
        </div>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="end-modal">
    <div class="modal">
      <h2 id="end-title">🎉 Bravo !</h2>
      <p id="end-text"></p>
      <p id="end-save-status" class="auth-hint"></p>
      <div class="btn-row">
        <button class="btn" id="end-replay">Rejouer</button>
        <a class="btn-secondary btn" href="../index.html">🏠 Menu</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <a href="../mentions-legales/index.html">Mentions l&eacute;gales</a> &middot; <a href="../confidentialite/index.html">Confidentialit&eacute;</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
