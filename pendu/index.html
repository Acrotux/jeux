<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Pendu — Jeux</title>
<meta name="theme-color" content="#4f6df5" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../favicon.ico" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../shared/style.css" />
<link rel="stylesheet" href="../shared/auth-widget.css" />
<link rel="stylesheet" href="style.css" />
<script src="../shared/theme.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../shared/supabase-config.js" defer></script>
<script src="../shared/supabase-client.js" defer></script>
<script src="../shared/auth-widget.js" defer></script>
<script src="../shared/pwa.js" defer></script>
<script src="../shared/version-badge.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html">← Jeux</a>
    <div class="brand"><span class="logo">🪢</span> Pendu</div>
    <div class="header-actions">
      <div id="auth-widget"></div>
      <button id="theme-toggle" class="icon-btn" aria-label="Changer de thème">🌙</button>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h1>Pendu</h1>
      <p>Devine le mot avant que le dessin ne soit complet.</p>
    </div>

    <div class="btn-row" id="category-row" style="margin-bottom: 16px;">
      <button class="btn-secondary btn cat-btn" data-cat="animaux">Animaux</button>
      <button class="btn-secondary btn cat-btn" data-cat="nature">Nature &amp; aliments</button>
      <button class="btn-secondary btn cat-btn" data-cat="metiers">Métiers</button>
      <button class="btn-secondary btn cat-btn" data-cat="pays">Pays</button>
      <button class="btn-secondary btn cat-btn" data-cat="melange">Mélange</button>
    </div>

    <div class="stats-row">
      <div class="stat"><div class="value" id="attempts-left">6</div><div class="label">Essais restants</div></div>
      <div class="stat"><div class="value" id="category-label">—</div><div class="label">Catégorie</div></div>
    </div>

    <div class="pendu-wrap">
      <svg id="hangman-svg" viewBox="0 0 200 220" width="220" height="240">
        <line x1="10" y1="210" x2="140" y2="210" stroke-width="6" stroke-linecap="round" class="part base" />
        <line x1="40" y1="210" x2="40" y2="15" stroke-width="6" stroke-linecap="round" class="part pole" />
        <line x1="40" y1="15" x2="130" y2="15" stroke-width="6" stroke-linecap="round" class="part beam" />
        <line x1="130" y1="15" x2="130" y2="45" stroke-width="4" stroke-linecap="round" class="part rope" />
        <circle cx="130" cy="65" r="20" stroke-width="4" fill="none" class="part head" />
        <line x1="130" y1="85" x2="130" y2="140" stroke-width="4" stroke-linecap="round" class="part body" />
        <line x1="130" y1="100" x2="105" y2="120" stroke-width="4" stroke-linecap="round" class="part arm-left" />
        <line x1="130" y1="100" x2="155" y2="120" stroke-width="4" stroke-linecap="round" class="part arm-right" />
        <line x1="130" y1="140" x2="110" y2="180" stroke-width="4" stroke-linecap="round" class="part leg-left" />
        <line x1="130" y1="140" x2="150" y2="180" stroke-width="4" stroke-linecap="round" class="part leg-right" />
      </svg>
    </div>

    <div id="word-display" class="word-display"></div>
    <p id="message" class="message"></p>

    <div id="keyboard" class="keyboard"></div>

    <div class="btn-row" style="margin-top: 20px;">
      <button class="btn" id="new-game">Nouveau mot</button>
    </div>
  </main>

  <div class="modal-overlay" id="end-modal">
    <div class="modal">
      <h2 id="end-title">🎉 Gagné !</h2>
      <p id="end-text"></p>
      <p id="end-save-status" class="auth-hint"></p>
      <div class="btn-row">
        <button class="btn" id="end-replay">Rejouer</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
